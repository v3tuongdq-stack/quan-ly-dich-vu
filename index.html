<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProFix 24/7 - Dịch Vụ Kỹ Thuật Tổng Hợp</title>

    <!-- Cấu hình PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ProFix 24/7">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1043/1043977.png">

    <!-- Tailwind CSS & FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>

    <!-- Thư viện EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // THAY PUBLIC KEY CỦA ANH VÀO DÒNG DƯỚI
            emailjs.init("A-U25hU6aQ03YTdpK");
        })();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md shadow-blue-200">
                    <i class="fa-solid fa-wrench"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 leading-none">ProFix 24/7</h1>
                    <p class="text-xs text-slate-500 mt-1">Dịch Vụ Kỹ Thuật Tổng Hợp</p>
                </div>
            </div>
            <a href="tel:0912345678" class="bg-blue-50 text-blue-600 hover:bg-blue-100 font-semibold text-xs px-3 py-2 rounded-lg transition flex items-center gap-2">
                <i class="fa-solid fa-phone-volume text-sm"></i>
                <span>Hotline</span>
            </a>
        </div>
    </header>

    <!-- Banner chính -->
    <section class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-8 px-4 text-center">
        <div class="max-w-2xl mx-auto">
            <span class="bg-blue-500/30 text-blue-100 text-xs font-semibold px-3 py-1 rounded-full border border-blue-400/30 inline-block mb-3">Phục Vụ Tận Nơi 24/7</span>
            <h2 class="text-2xl font-bold mb-2">Đặt Lịch Sửa Chữa Nhanh Chóng</h2>
            <p class="text-blue-100 text-sm">Điện nước, điện lạnh và xử lý sự cố kỹ thuật gia đình uy tín - chuyên nghiệp.</p>
        </div>
    </section>

    <!-- Form Đặt Lịch -->
    <main class="max-w-xl mx-auto px-4 -mt-4 relative z-10">
        <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6">
            <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-regular fa-calendar-check text-blue-600"></i>
                Thông Tin Đặt Lịch
            </h3>

            <form id="bookingForm" onsubmit="sendBookingEmail(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Họ và tên <span class="text-red-500">*</span></label>
                    <input type="text" id="name" required placeholder="Nguyễn Văn A" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Số điện thoại <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" required placeholder="0912 345 678" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Địa chỉ phục vụ <span class="text-red-500">*</span></label>
                    <input type="text" id="address" required placeholder="Số nhà, đường, xã/phường..." class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Dịch vụ cần hỗ trợ <span class="text-red-500">*</span></label>
                    <select id="service" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition bg-white">
                        <option value="">-- Chọn dịch vụ --</option>
                        <option value="Sửa chữa Điện gia dụng">Sửa chữa Điện gia dụng</option>
                        <option value="Sửa chữa Hệ thống Nước">Sửa chữa Hệ thống Nước</option>
                        <option value="Bảo dưỡng / Sửa Điều hòa">Bảo dưỡng / Sửa Điều hòa</option>
                        <option value="Lắp đặt thiết bị kỹ thuật">Lắp đặt thiết bị kỹ thuật</option>
                        <option value="Dịch vụ tổng hợp khác">Dịch vụ tổng hợp khác</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Ghi chú thêm</label>
                    <textarea id="note" rows="3" placeholder="Mô tả sự cố hoặc thời gian mong muốn..." class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Xác Nhận Đặt Lịch</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Script xử lý gửi Email -->
    <script>
        function sendBookingEmail(event) {
            event.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Đang gửi thông tin...</span>';

            const templateParams = {
                user_name: document.getElementById('name').value,
                user_phone: document.getElementById('phone').value,
                user_address: document.getElementById('address').value,
                service_name: document.getElementById('service').value,
                note: document.getElementById('note').value || 'Không có'
            };

            // THAY SERVICE ID & TEMPLATE ID CỦA ANH VÀO DÒNG DƯỚI
            emailjs.send("v3tuongdq@gmail.com", "template_mwbfbaq", templateParams)
                .then(function(response) {
                    alert('🎉 Đặt lịch thành công! Kỹ thuật viên ProFix 24/7 sẽ liên hệ với bạn trong thời gian sớm nhất.');
                    document.getElementById('bookingForm').reset();
                }, function(error) {
                    alert('⚠️ Có lỗi xảy ra khi gửi đơn. Vui lòng thử lại hoặc gọi trực tiếp Hotline!');
                    console.error('Lỗi EmailJS:', error);
                })
                .finally(function() {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Xác Nhận Đặt Lịch</span>';
                });
        }

        // Đăng ký Service Worker cho PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker đăng ký thành công!'))
                    .catch(err => console.log('Service Worker thất bại:', err));
            });
        }
    </script>
</body>
</html>
